<div class="field-row" id="customer-request-template-picker" hidden>
    <label for="customer-request-template-select">Šablona požadavku</label>
    <div class="field-input">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <select id="customer-request-template-select" class="form-control" style="min-width:min(100%,280px);flex:1 1 220px;">
                <option value="">--- vyberte šablonu ---</option>
            </select>
            <button type="button" class="btn secondary" id="customer-request-template-apply-btn">Použít šablonu</button>
            <button type="button" class="btn secondary" id="customer-request-template-save-btn">Uložit jako šablonu</button>
        </div>
        <small style="display:block;margin-top:6px;max-width:44rem;line-height:1.45;">
            Uloží nebo doplní subjekt, odpad, koncovku a adresu plnění. Každý uživatel vidí své šablony; dispečer a admin všechny.
        </small>
    </div>
</div>
