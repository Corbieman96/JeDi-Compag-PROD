<div id="zpo-pairing-dock" class="zpo-pairing-dock" aria-live="polite">
    <div class="zpo-pairing-dock__head">
        <span>{{ dock_title|default:"ZPO + detail jízdy (párování pasů)" }}</span>
        <button type="button" id="zpo-pairing-dock-min" title="Skrýt / zobrazit panel">Panel</button>
    </div>
    <div class="zpo-pairing-dock__inner" id="zpo-pairing-dock-body">
        <div id="zpo-pairing-dock-zpo" class="zpo-pairing-dock__zpo"></div>
        <div id="zpo-pairing-dock-detail" class="zpo-pairing-dock__detail"></div>
    </div>
</div>
