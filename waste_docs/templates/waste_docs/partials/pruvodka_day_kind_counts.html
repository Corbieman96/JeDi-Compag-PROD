{% if day_kind_counts %}
<div class="jedis-day-kind-counts" style="margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-surface-alt, #f4f6f4);">
    <h2 class="form-section-title" style="margin: 0 0 8px; font-size: 0.98rem;">Jízdy v den</h2>
    <p class="dash-muted" style="margin: 0 0 10px; font-size: 0.9rem;">{{ day_kind_counts.date|date:"l j. n. Y" }}</p>
    <table style="width: 100%; border-collapse: collapse; font-size: 0.92rem; text-align: center;">
        <thead>
            <tr>
                {% for row in day_kind_counts.rows %}
                <th scope="col" style="padding: 4px 6px; font-weight: 600; border-bottom: 1px solid var(--color-border);">{{ row.label }}</th>
                {% endfor %}
                <th scope="col" style="padding: 4px 6px; font-weight: 600; border-bottom: 1px solid var(--color-border);">Celkem</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                {% for row in day_kind_counts.rows %}
                <td style="padding: 6px; font-weight: 600;">{{ row.count }}</td>
                {% endfor %}
                <td style="padding: 6px; font-weight: 700;">{{ day_kind_counts.total }}</td>
            </tr>
        </tbody>
    </table>
</div>
{% endif %}
