<div id="cr-day-kind-counts-modal" class="map-modal" aria-hidden="true">
    <div class="map-modal__card cr-day-kind-counts-modal__card">
        <div class="cr-day-kind-counts-modal__head">
            <h2 class="cr-day-kind-counts-modal__title">Zatížení dne požadavku</h2>
            <button type="button" class="btn secondary" data-cr-day-kind-counts-close>Zavřít</button>
        </div>
        <p id="cr-day-kind-counts-date-display" class="dash-muted cr-day-kind-counts-modal__date"></p>
        <div id="cr-day-kind-counts-loading" class="cr-day-kind-counts-modal__loading" hidden>Načítám…</div>
        <div id="cr-day-kind-counts-error" class="cr-day-kind-counts-modal__error" hidden></div>
        <div class="table-wrap">
            <table id="cr-day-kind-counts-table" class="cr-day-kind-counts-modal__table">
                <thead>
                    <tr id="cr-day-kind-counts-head-row"></tr>
                </thead>
                <tbody id="cr-day-kind-counts-body"></tbody>
            </table>
        </div>
        <p id="cr-day-kind-counts-note" class="dash-muted cr-day-kind-counts-modal__note" hidden></p>
    </div>
</div>
