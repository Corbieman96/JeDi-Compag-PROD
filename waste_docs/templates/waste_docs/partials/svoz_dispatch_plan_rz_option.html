<option
    value="{{ rz.pk }}"
{% if rz.pk in plan_rz_has_ride_ids %} class="svoz-plan-rz-opt--has-ride{% if rz.pk in plan_rz_multi_slot_ids %} svoz-plan-rz-opt--multi-slot{% endif %}"{% elif rz.pk in plan_rz_multi_slot_ids %} class="svoz-plan-rz-opt--multi-slot"{% endif %}
