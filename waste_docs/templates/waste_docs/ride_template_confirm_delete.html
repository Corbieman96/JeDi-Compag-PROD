{% extends "base.html" %}

{% block title %}Smazat šablonu{% endblock %}

{% block content %}
<div class="card">
    <h1>Smazat šablonu</h1>
    <p>Opravdu chcete smazat šablonu <strong>{{ item.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn danger">Smazat</button>
        <a class="btn secondary" href="{% url 'waste_docs:ride_template_list' %}">Zpět</a>
    </form>
</div>
{% endblock %}
