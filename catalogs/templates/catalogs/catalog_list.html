{% extends "base.html" %}

{% block title %}{{ label }}{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ label }}</h1>
    <a class="btn" href="{% url 'catalogs:create' slug %}">Nová položka</a>
</div>

<div class="card">
    <table>
        <thead><tr><th>Hodnota</th><th>Akce</th></tr></thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.value }}</td>
                <td class="actions">
                    <a class="btn" href="{% url 'catalogs:edit' slug item.pk %}">Upravit</a>
                    <a class="btn danger" href="{% url 'catalogs:delete' slug item.pk %}">Smazat</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Zatím bez položek.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
