{% extends "base.html" %}

{% block title %}{% if is_edit %}Úprava odpadu{% else %}Nový odpad{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if is_edit %}Úprava odpadu{% else %}Nový odpad{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Uložit</button>
        <a class="btn secondary" href="{% url 'catalogs:waste_type_list' %}">Zpět</a>
    </form>
</div>
{% endblock %}
